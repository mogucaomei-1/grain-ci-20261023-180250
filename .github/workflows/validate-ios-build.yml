name: Validate iOS Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-without-signing:
    name: Compile for iOS Simulator
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Compile
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci
          xcodebuild \
            -project outputs/GRAIN/GRAIN.xcodeproj \
            -scheme GRAIN \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath ci/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build | tee ci/unsigned-build.log

      - name: Download Sony ARW regression sample
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 \
            "https://raw.pixls.us/data/Sony/ZV-E10/DSC00002.ARW" \
            --output ci/raw-smoke-test/sony-sample.arw

      - name: Test real Sony ARW decode and full-size export
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc \
            outputs/GRAIN/GRAIN/Models.swift \
            outputs/GRAIN/GRAIN/CropProcessor.swift \
            outputs/GRAIN/GRAIN/ImageProcessor.swift \
            ci/raw-smoke-test/main.swift \
            -o ci/raw-smoke-test/raw-smoke-test
          ci/raw-smoke-test/raw-smoke-test \
            ci/raw-smoke-test/sony-sample.arw \
            ci/raw-smoke-test/sony-export.jpg

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GRAIN-unsigned-build-log
          path: ci/unsigned-build.log
          if-no-files-found: ignore
          retention-days: 7

