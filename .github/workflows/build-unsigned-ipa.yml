name: Build Unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-ipa:
    name: Archive without signing
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned device archive
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci/unsigned
          xcodebuild \
            -project outputs/GRAIN/GRAIN.xcodeproj \
            -scheme GRAIN \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ci/unsigned/GRAIN.xcarchive \
            -derivedDataPath ci/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive | tee ci/unsigned/archive.log

      - name: Package Payload
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH=$(find ci/unsigned/GRAIN.xcarchive/Products/Applications -maxdepth 1 -type d -name "*.app" -print -quit)
          test -n "$APP_PATH"

          # 编译并内嵌官方 WidgetKit App Extension (.appex)
          echo "=== Building GRAINWidgetsExtension.appex ==="
          IPHONEOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          EXTENSION_DIR="ci/unsigned/GRAINWidgetsExtension.appex"
          mkdir -p "$EXTENSION_DIR"

          xcrun --sdk iphoneos swiftc \
            -target arm64-apple-ios17.0 \
            -sdk "$IPHONEOS_SDK" \
            -O \
            -parse-as-library \
            -application-extension \
            -framework SwiftUI \
            -framework WidgetKit \
            -framework Foundation \
            -Xlinker -application_extension \
            -Xlinker -rpath -Xlinker @executable_path/Frameworks \
            -Xlinker -rpath -Xlinker @executable_path/../../Frameworks \
            outputs/GRAIN/GRAINWidgetsExtension/GRAINWidgetsBundle.swift \
            -o "$EXTENSION_DIR/GRAINWidgetsExtension"

          cp outputs/GRAIN/GRAINWidgetsExtension/Info.plist "$EXTENSION_DIR/Info.plist"
          plutil -convert binary1 "$EXTENSION_DIR/Info.plist"
          printf 'XPC!????' > "$EXTENSION_DIR/PkgInfo"

          # 对 App Extension 及主 App 进行标准 ad-hoc 签名以生成完整的 _CodeSignature/CodeResources（满足 TrollStore、AltStore、Sideloadly 与 iOS 官方 PluginKit 扩展注册要求）
          codesign -s - --force --deep "$EXTENSION_DIR"

          # 内嵌至主 App 的 PlugIns 目录
          mkdir -p "$APP_PATH/PlugIns"
          cp -R "$EXTENSION_DIR" "$APP_PATH/PlugIns/"
          echo "=== PlugIns embedded successfully ==="
          ls -la "$APP_PATH/PlugIns/GRAINWidgetsExtension.appex"

          # 主 App 统一签名生成完整匹配的代码签名树
          codesign -s - --force --deep "$APP_PATH"

          mkdir -p ci/unsigned/Payload
          cp -R "$APP_PATH" ci/unsigned/Payload/
          cd ci/unsigned
          zip -r -X GRAIN-unsigned.zip Payload
          mv GRAIN-unsigned.zip GRAIN-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: GRAIN-unsigned-ipa
          path: ci/unsigned/GRAIN-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload archive log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GRAIN-unsigned-archive-log
          path: ci/unsigned/archive.log
          if-no-files-found: ignore
          retention-days: 7

